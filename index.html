<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Dwi Karya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .item-row:nth-child(even) { background: #f8fafc; }
    </style>
</head>
<body class="bg-slate-100 font-sans pb-24">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <h1 class="text-lg font-bold">TOKO DWI KARYA</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- TAB KASIR -->
        <div id="tab-kasir" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-sm">Input Pesanan</h2>
                    <button onclick="startScanner()" class="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-bold">📷 Scan</button>
                </div>
                <div id="reader" class="hidden w-full h-48 bg-black rounded-lg"></div>
                
                <input type="text" id="cust-name" list="cust-list" placeholder="Nama Pelanggan" class="w-full border p-2 rounded text-sm">
                <datalist id="cust-list"></datalist>

                <div id="items-list" class="space-y-2 border-t pt-2"></div>
                <button onclick="addRow()" class="w-full py-2 bg-blue-50 text-blue-600 text-xs font-bold rounded">+ Tambah Barang</button>
                
                <div class="border-t pt-3 font-bold flex justify-between text-lg">
                    <span>Total:</span> <span id="grand-total">Rp 0</span>
                </div>
                <button onclick="processOrder()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Proses Pesanan</button>
            </div>
        </div>

        <!-- TAB STOK -->
        <div id="tab-stok" class="hidden space-y-3">
            <div class="bg-white p-4 rounded-xl shadow-sm border space-y-2">
                <h2 class="font-bold text-sm">Tambah Barang Manual</h2>
                <input id="prod-name" placeholder="Nama Barang" class="w-full border p-2 rounded text-sm">
                <div class="grid grid-cols-2 gap-2">
                    <input id="prod-price" placeholder="Harga Jual" type="number" class="border p-2 rounded text-sm">
                    <input id="prod-stock" placeholder="Stok Awal" type="number" class="border p-2 rounded text-sm">
                </div>
                <button onclick="addProduct()" class="w-full bg-slate-800 text-white p-2 rounded font-bold">Simpan Stok</button>
            </div>
            <div id="stok-list" class="bg-white p-4 rounded-xl shadow-sm border space-y-2"></div>
        </div>

        <!-- TAB LAPORAN -->
        <div id="tab-laporan" class="hidden bg-white p-4 rounded-xl shadow-sm border space-y-4">
            <h2 class="font-bold text-sm">Laporan Harian</h2>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="exportExcel()" class="bg-emerald-600 text-white p-3 rounded font-bold text-sm">Excel</button>
                <button onclick="sendWA()" class="bg-green-500 text-white p-3 rounded font-bold text-sm">WA Laporan</button>
            </div>
            <div id="history-list" class="text-xs space-y-2"></div>
        </div>
    </main>

    <!-- NAV BOTTOM -->
    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around p-3 text-[10px] font-bold">
        <button onclick="showTab('kasir')">🛒 Kasir</button>
        <button onclick="showTab('stok')">📦 Stok</button>
        <button onclick="showTab('laporan')">📈 Laporan</button>
    </nav>

    <script>
        let items = JSON.parse(localStorage.getItem('items')) || [];
        let history = JSON.parse(localStorage.getItem('history')) || [];

        function showTab(t) {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
            document.getElementById('tab-' + t).classList.remove('hidden');
        }

        function addRow() {
            const div = document.createElement('div');
            div.className = "flex gap-1 item-row items-center";
            div.innerHTML = `
                <input class="w-1/3 border p-1 rounded text-xs name" placeholder="Barang">
                <input class="w-16 border p-1 rounded text-xs qty" placeholder="Qty" value="1" oninput="calc()">
                <input class="w-20 border p-1 rounded text-xs price" placeholder="Harga" oninput="calc()">
                <input class="w-16 border p-1 rounded text-xs disc" placeholder="Disc" value="0" oninput="calc()">
                <button onclick="this.parentElement.remove(); calc()" class="text-red-500 font-bold">✕</button>
            `;
            document.getElementById('items-list').appendChild(div);
        }

        function calc() {
            let total = 0;
            document.querySelectorAll('.item-row').forEach(row => {
                const q = row.querySelector('.qty').value || 0;
                const p = row.querySelector('.price').value || 0;
                const d = row.querySelector('.disc').value || 0;
                total += (q * p) - d;
            });
            document.getElementById('grand-total').innerText = 'Rp ' + total.toLocaleString();
        }

        function processOrder() {
            const total = document.getElementById('grand-total').innerText;
            const name = document.getElementById('cust-name').value || 'Umum';
            history.push({ name, total, date: new Date().toLocaleString() });
            localStorage.setItem('history', JSON.stringify(history));
            alert('Pesanan diproses!');
            location.reload();
        }

        function addProduct() {
            items.push({ name: document.getElementById('prod-name').value, price: document.getElementById('prod-price').value });
            localStorage.setItem('items', JSON.stringify(items));
            alert('Stok ditambah');
            renderStok();
        }

        function renderStok() {
            document.getElementById('stok-list').innerHTML = items.map(i => `<div>${i.name} - ${i.price}</div>`).join('');
        }

        function startScanner() {
            document.getElementById('reader').classList.remove('hidden');
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (data) => {
                alert('Barcode: ' + data);
                html5QrCode.stop();
                document.getElementById('reader').classList.add('hidden');
            });
        }

        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(history);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Penjualan");
            XLSX.writeFile(wb, "Laporan.xlsx");
        }

        function sendWA() {
            window.open('https://wa.me/?text=LaporanPenjualan: ' + JSON.stringify(history));
        }

        renderStok(); addRow();
    </script>
</body>
</html>
